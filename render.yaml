services:
  - type: web
    name: slop-fabrika
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 900
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GEMINI_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: FORENSIC_VIDEO_FPS
        value: 5
      - key: RADAR_VIDEO_FPS
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 120
