name: V34 Legacy V27 Compatibility Smoke

on:
  pull_request:
    paths:
      - 'radar_omni_veo_v21.py'
      - 'radar_omni_veo_v22.py'
      - 'radar_fresh_run_v23.py'
      - 'radar_omni_veo_veo3_v24.py'
      - 'radar_momentum_cloud_v25.py'
      - 'radar_runtime_polish_v26.py'
      - 'radar_strict_scope_v27.py'
      - 'radar_multiplatform_v28.py'
      - 'radar_budget_v29.py'
      - 'radar_audit_v30.py'
      - 'radar_broad_v34.py'
      - 'radar_runtime_v27.py'
      - '.github/workflows/omni-veo-v22-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'radar_omni_veo_v21.py'
      - 'radar_omni_veo_v22.py'
      - 'radar_fresh_run_v23.py'
      - 'radar_omni_veo_veo3_v24.py'
      - 'radar_momentum_cloud_v25.py'
      - 'radar_runtime_polish_v26.py'
      - 'radar_strict_scope_v27.py'
      - 'radar_multiplatform_v28.py'
      - 'radar_budget_v29.py'
      - 'radar_audit_v30.py'
      - 'radar_broad_v34.py'
      - 'radar_runtime_v27.py'
      - '.github/workflows/omni-veo-v22-smoke.yml'

jobs:
  legacy-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Verify legacy helpers remain compatible under V34
        env:
          SECRET_KEY: smoke-test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          import app as app_module
          import radar_audit_v30 as v30
          import radar_broad_v34 as v34
          import radar_budget_v29 as v29
          import radar_omni_veo_veo3_v24 as v24
          import radar_request_job as radar_job
          import radar_strict_scope_v27 as v27

          status = app_module.app.test_client().get('/api/status').get_json()
          assert status['radar_runtime'] == v30.MODE_VERSION, status
          assert status['radar_mode'] == v30.MODE_VERSION, status
          assert status['radar_product_mode'] == v34.MODE_VERSION, status
          assert status['radar_hashtags'] == ['omni', 'veo', 'veo3', 'ai', 'ии'], status
          assert status['radar_platforms'] == ['Instagram Reels', 'TikTok', 'YouTube Shorts'], status
          assert status['radar_lookback_days'] == 14, status
          assert status['radar_max_raw_requested'] == 900, status
          assert status['radar_ai_analyze_limit'] == 150, status
          assert status['radar_apify_discovery_hard_cap_usd'] == 2.8, status
          assert status['runtime_info']['audit_top10_closed'] is True, status
          assert status['runtime_info']['target_output_min'] == 50, status
          assert status['runtime_info']['target_output_max'] == 100, status
          assert status['radar_speech_required'] is False, status
          assert radar_job.RADAR_AI_ANALYZE_LIMIT == 150
          assert app_module.KEEP_LIMIT == 100

          sources = radar_job._build_sources()
          assert set(sources) == {'instagram', 'tiktok', 'youtube'}, sources
          assert all(x['max_items'] == 300 for x in sources.values())
          assert sum(float(x['max_total_charge_usd']) for x in sources.values()) == 2.8
          assert all(x['strict_scope_marker'] == v30.SOURCE_MARKER for x in sources.values())

          # Old V27 post-level hashtag proof remains an internal building block.
          now = datetime.now(timezone.utc)
          base = {
              'ownerUsername': 'legacy_helper',
              'timestamp': now.isoformat(),
              'videoDuration': 8.4,
              'videoPlayCount': 50_000,
              'likesCount': 900,
              'commentsCount': 40,
          }
          unrelated = {**base,'url':'https://www.instagram.com/reel/UNRELATED/','caption':'POV #funny #over40'}
          assert v27.normalize_strict_candidate(unrelated, 'hashtag: veo', {}) is None
          tagged = {**base,'url':'https://www.instagram.com/reel/VEO3/','caption':'new experiment #veo3'}
          normalized = v27.normalize_strict_candidate(tagged, 'hashtag: veo3', {})
          assert normalized and normalized['search_term'] == 'veo3', normalized

          # Existing momentum helper still prefers current velocity.
          fast = v24._v24_score({'views': 30_000, 'hours_since_publish': 2.0, 'viral_score_v2': 50.0}, 15_000, 0.0, False)
          slow = v24._v24_score({'views': 300_000, 'hours_since_publish': 48.0, 'viral_score_v2': 80.0}, 1_500, 0.0, False)
          assert fast > slow, (fast, slow)

          # Broad output changes no legacy safety/budget behavior.
          assert v34.broad_matches(__import__('radar_multiplatform_v28')._reject('NO_SPOKEN_DIALOGUE: synthetic')) is True
          budget = v29.budget_breakdown_v29()
          assert budget['hard_total_target_usd'] == 5.0
          assert budget['hard_apify_discovery_caps_usd'] == 2.8
          assert budget['gemini_analyze_limit'] == 150
          print('V34 LEGACY V27 COMPATIBILITY OK')
          PY
