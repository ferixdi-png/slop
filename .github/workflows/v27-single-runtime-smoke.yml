name: V27 Single Runtime Smoke

on:
  pull_request:
    paths:
      - 'app.py'
      - 'radar_runtime_v27.py'
      - 'radar_discovery_v27.py'
      - 'radar_logs.py'
      - 'radar_strict_scope_v27.py'
      - 'radar_edge_v19.py'
      - 'gunicorn.conf.py'
      - '.github/workflows/v27-single-runtime-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'radar_runtime_v27.py'
      - 'radar_discovery_v27.py'
      - 'radar_logs.py'
      - 'radar_strict_scope_v27.py'
      - 'radar_edge_v19.py'
      - 'gunicorn.conf.py'
      - '.github/workflows/v27-single-runtime-smoke.yml'

jobs:
  single-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile runtime
        run: python -m compileall -q app.py radar_runtime_v27.py radar_discovery_v27.py radar_logs.py radar_strict_scope_v27.py gunicorn.conf.py
      - name: Verify one authoritative V27 bootstrap
        env:
          SECRET_KEY: smoke-test
          PORT: '10000'
        run: |
          python - <<'PY'
          import contextlib
          import io
          import runpy

          stdout = io.StringIO()
          with contextlib.redirect_stdout(stdout):
              import app as app_module

          startup = stdout.getvalue()
          startup_lines = [line for line in startup.splitlines() if '[startup]' in line]
          assert len(startup_lines) == 1, startup
          assert 'V27 RUNTIME READY' in startup_lines[0], startup

          banned = (
              'GLOBAL AI v9',
              'BUDGET AI v11',
              'HIGH-FREQ AI v13',
              'DIALOGUE-ONLY v15',
              'DIALOGUE MOTION v16',
              'V17 READY',
              'V19 HARDENING READY',
              'SOURCE AGGREGATION v20 READY',
              'OMNI/VEO V21 READY',
              'OMNI/VEO V22 READY',
              'V24 READY',
              'V25 READY',
              'FRESH RUN V23 READY',
              'V20 EDGE GUARDS READY',
          )
          for marker in banned:
              assert marker not in startup, (marker, startup)

          import radar_request_job as radar_job
          import radar_runtime_v27 as runtime
          import radar_strict_scope_v27 as v27

          assert runtime._APPLIED is True
          assert runtime._LIVENESS_INSTALLED is True
          assert v27._APPLIED is True
          assert app_module.RADAR_RUNTIME == v27.MODE_VERSION
          assert app_module.EDGE_PROFILE == v27.MODE_VERSION
          assert app_module.RADAR_MAX_DURATION_SEC == 15.05
          assert app_module.KEEP_LIMIT == 180

          c = app_module.app.test_client()
          status = c.get('/api/status').get_json()
          assert status['radar_runtime'] == v27.MODE_VERSION, status
          assert status['radar_profile'] == v27.MODE_VERSION, status
          assert status['edge_profile'] == v27.MODE_VERSION, status
          assert status['radar_mode'] == v27.MODE_VERSION, status
          assert status['radar_hashtags'] == ['omni', 'veo', 'veo3'], status
          assert status['radar_source_max_duration_sec'] == 15.05, status
          assert status['radar_compressed_target_sec'] == 10.0, status
          assert status['runtime_info']['legacy_startup_banners_suppressed'] is True, status
          assert status['runtime_info']['render_fast_liveness'] is True, status
          assert status['runtime_info']['discovery_actor'] == 'apify/instagram-scraper', status
          assert status['runtime_info']['discovery_results_per_tag'] == 250, status

          # CRITICAL Render contract: liveness must survive a completely broken
          # SQLite read path. HEAD / is what Render has been probing in prod.
          original_db_conn = app_module.db_conn
          def broken_db_conn():
              raise RuntimeError('synthetic SQLite outage')
          app_module.db_conn = broken_db_conn
          try:
              root_head = c.head('/')
              assert root_head.status_code == 200, root_head.get_data(as_text=True)
              healthz_head = c.head('/healthz')
              assert healthz_head.status_code == 200, healthz_head.get_data(as_text=True)
              healthz_get = c.get('/healthz')
              assert healthz_get.status_code == 200, healthz_get.get_data(as_text=True)
              assert healthz_get.get_json()['runtime'] == v27.MODE_VERSION
          finally:
              app_module.db_conn = original_db_conn

          # Explicit Render bind contract.
          gunicorn_conf = runpy.run_path('gunicorn.conf.py')
          assert gunicorn_conf['bind'] == '0.0.0.0:10000', gunicorn_conf['bind']

          sources = radar_job._build_sources()
          assert set(sources) == {'hashtag_omni', 'hashtag_veo', 'hashtag_veo3'}, sources
          for tag in ('omni', 'veo', 'veo3'):
              source = sources[f'hashtag_{tag}']
              assert source.get('strict_scope_marker') == v27.STRICT_SOURCE_MARKER, source
              assert source.get('actor_id') == 'apify/instagram-scraper', source
              payload = source.get('input') or {}
              assert payload.get('directUrls') == [f'https://www.instagram.com/explore/tags/{tag}/'], payload
              assert payload.get('resultsType') == 'reels', payload
              assert payload.get('resultsLimit') == 250, payload
              assert payload.get('onlyPostsNewerThan') == '7 days', payload

          print('V27 SINGLE RUNTIME + HIGH-VOLUME DISCOVERY + RENDER LIVENESS OK')
          PY
