name: V41 Single Runtime Broad Pool Smoke

on:
  pull_request:
    paths:
      - 'app.py'
      - 'radar_runtime_v27.py'
      - 'radar_broad_v34.py'
      - 'radar_momentum_v34.py'
      - 'youtube_genai_v34.py'
      - 'frontend_broad_v34.py'
      - 'frontend_failopen_v33.py'
      - 'frontend_manual_start_v35.py'
      - 'radar_manual_start_v35.py'
      - 'prompt_reliability_v36.py'
      - 'radar_json_headroom_v38.py'
      - 'mvp_passive_recovery_v39.py'
      - 'metrics_truth_v40.py'
      - 'gemini_overload_v40.py'
      - 'product_finish_v41.py'
      - 'radar_multiplatform_v28.py'
      - 'radar_budget_v29.py'
      - 'radar_audit_v30.py'
      - 'radar_v28_finish.py'
      - 'requirements.txt'
      - '.github/workflows/v27-single-runtime-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'radar_runtime_v27.py'
      - 'radar_broad_v34.py'
      - 'radar_momentum_v34.py'
      - 'metrics_truth_v40.py'
      - 'gemini_overload_v40.py'
      - 'product_finish_v41.py'
      - '.github/workflows/v27-single-runtime-smoke.yml'

jobs:
  broad-single-runtime:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: v41-single-runtime
      PORT: '10000'
      APIFY_API_TOKEN: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py radar_runtime_v27.py radar_broad_v34.py radar_momentum_v34.py metrics_truth_v40.py gemini_overload_v40.py product_finish_v41.py
      - name: Verify one production runtime and all current product overlays
        run: |
          python - <<'PY'
          import contextlib
          import io
          from datetime import datetime, timedelta, timezone

          stdout = io.StringIO()
          with contextlib.redirect_stdout(stdout):
              import app as app_module
          startup = stdout.getvalue()
          lines = [x for x in startup.splitlines() if '[startup]' in x]
          assert len(lines) == 1, startup
          line = lines[0]
          assert 'V40 MVP READY' in line, line
          assert 'public platform view metrics' in line, line
          assert 'HTTP 503' in line, line

          import metrics_truth_v40 as metrics
          import product_finish_v41 as v41
          import radar_audit_v30 as v30
          import radar_broad_v34 as v34
          import radar_budget_v29 as v29
          import radar_multiplatform_v28 as v28
          import radar_request_job as radar_job
          import radar_runtime_v27 as runtime
          import youtube_genai_v34 as yt34
          from db import db_conn

          assert runtime._APPLIED is True
          assert runtime.PRODUCT_MODE == v34.MODE_VERSION
          assert app_module.RADAR_RUNTIME == v30.MODE_VERSION
          assert app_module.PROFILE_VERSION == v30.SCREENING_PROFILE
          assert app_module.KEEP_LIMIT == 100
          assert radar_job.RADAR_AI_ANALYZE_LIMIT == 150
          assert radar_job._process_one_ai is v34.process_one_ai_v34
          assert radar_job._prepare_candidates is v34.prepare_candidates_v34
          assert app_module.top_eligible is v41.broad_eligible_v41
          assert v34.broad_eligible is v41.broad_eligible_v41
          assert v41._BASE_BROAD_ELIGIBLE is not None
          assert getattr(v41._BASE_BROAD_ELIGIBLE,'__name__','') == 'broad_eligible'
          assert v28.matches_v28 is v34.broad_matches
          assert v28.classify_youtube_url_v28 is yt34.classify_youtube_url_v34
          assert radar_job.normalize_reel is v41.normalize_candidate_v41
          assert v41._BASE_NORMALIZE is metrics.normalize_candidate_v40

          c = app_module.app.test_client()
          status = c.get('/api/status').get_json()
          info = status['runtime_info']
          assert status['radar_runtime'] == v30.MODE_VERSION, status
          assert info['product_mode'] == v34.MODE_VERSION, status
          assert info['target_output_min'] == 50 and info['target_output_max'] == 100, status
          assert info['ai_enrich_limit'] == 20 and info['ai_role'] == 'enrichment_only', status
          assert info['speech_required'] is False and status['radar_speech_required'] is False, status
          assert info['manual_start_only'] is True and info['auto_resume_on_page_load'] is False, status
          assert info['tick_requires_driver_token'] is True and info['driver_token_persisted'] is False, status
          assert info['broad_candidate_prompt_access'] is True, status
          assert info['apify_private_media_auth'] == 'bearer_header_only', status
          assert info['apify_signed_record_fallback'] is True, status
          assert info['prompt_token_in_url'] is False and info['redirect_token_forwarding'] is False, status
          assert info['v38_installed'] is True and info['passive_recovery_active'] is True, status
          assert info['metrics_profile'] == 'metrics_truth_v40_public_counts', status
          assert info['instagram_views_metric'] == 'videoPlayCount', status
          assert info['tiktok_views_metric'] == 'playCount', status
          assert info['youtube_views_metric'] == 'viewCount', status
          assert info['automatic_metric_refresh'] is False, status
          assert info['gemini_final_overload_http'] == 503, status
          assert status['radar_hard_total_target_usd'] == 5.0, status
          assert status['radar_apify_discovery_hard_cap_usd'] == 2.8, status
          assert status['radar_budget_headroom_usd'] == 2.2, status
          assert status['radar_results_per_tag_per_platform'] == 60, status
          assert status['radar_max_raw_requested'] == 900, status
          assert info['automatic_paid_refreshes'] is False and info['audit_top10_closed'] is True, status

          b = v29.budget_breakdown_v29()
          assert b['hard_total_target_usd'] == 5.0
          assert b['hard_apify_discovery_caps_usd'] == 2.8
          assert sum(b['source_caps_usd'].values()) == 2.8

          no_speech = v28._reject('NO_SPOKEN_DIALOGUE: synthetic')
          timing = v28._reject('TIMING_OR_MECHANIC_REJECT: synthetic', spoken=True)
          tutorial = v28._reject('TUTORIAL_OR_REVIEW: synthetic', spoken=True)
          static = v28._reject('REJECT_STATIC_IMAGE: synthetic')
          assert v34.broad_matches(no_speech) is True
          assert v34.broad_matches(timing) is True
          assert v34.broad_matches(tutorial) is True
          assert v34.broad_matches(static) is False

          now = datetime.now(timezone.utc)
          with db_conn() as conn:
              conn.execute('DELETE FROM radar_posts')
              reasons = ['', 'NO_SPOKEN_DIALOGUE: synthetic', 'TIMING_OR_MECHANIC_REJECT: synthetic',
                         'TUTORIAL_OR_REVIEW: synthetic', v28.PASS_PREFIX + 'DIRECT: synthetic']
              for i in range(90):
                  platform = v28.PLATFORMS[i % len(v28.PLATFORMS)]
                  tag = v28.TARGET_TAGS[i % len(v28.TARGET_TAGS)]
                  reason = reasons[i % len(reasons)]
                  checked = 0 if not reason else 1
                  if platform == 'TikTok':
                      post_url = f'https://www.tiktok.com/@creator{i}/video/{7534567890000000000+i}'
                  else:
                      post_url = f'https://example.com/video/{i}'
                  conn.execute(
                      '''INSERT INTO radar_posts(platform,creator,post_url,published_at,duration_sec,views,likes,comments,
                         hours_since_publish,views_per_hour,viral_score_v2,search_term,ai_checked,ai_match,screening_profile,reason)
                         VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)''',
                      (platform,f'creator{i}',post_url,(now-timedelta(hours=(i%72)+1)).isoformat(),
                       8.0,500000-i*1000,1000,40,(i%72)+1,50000-i*100,95-i*0.3,tag,checked,0,v30.SCREENING_PROFILE,reason),
                  )
              conn.execute(
                  '''INSERT INTO radar_posts(platform,creator,post_url,published_at,duration_sec,views,likes,comments,
                     hours_since_publish,views_per_hour,viral_score_v2,search_term,ai_checked,ai_match,screening_profile,reason)
                     VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)''',
                  ('Instagram Reels','static','https://example.com/static',now.isoformat(),8.0,9000000,10000,100,
                   1,9000000,100,'ai',1,0,v30.SCREENING_PROFILE,'REJECT_STATIC_IMAGE: synthetic'),
              )
              conn.commit()

          top = c.get('/api/radar').get_json()
          assert 50 <= len(top) <= 100, len(top)
          assert all(x['trend_pool'] is True for x in top)
          assert all(x['speech_required_for_top'] is False for x in top)
          assert all(x['ai_role'] == 'enrichment_only' for x in top)
          assert not any(x['post_url'] == 'https://example.com/static' for x in top)
          assert all(v41.is_canonical_tiktok_url(x['post_url']) for x in top if x['platform']=='TikTok')
          labels = {x['adaptation_status'] for x in top}
          assert {'ADD_RUSSIAN_SPEECH','REBUILD_TO_10S','NOT_ENRICHED'}.issubset(labels), labels
          assert top[0]['viral_score_v2'] >= top[-1]['viral_score_v2']

          html = c.get('/').get_data(as_text=True)
          assert 'V34 BROAD TREND POOL' in html
          assert '50–100' in html and 'MANUAL START ONLY' in html
          assert 'window.__V35_MANUAL_START__=true' in html
          assert 'ОБНОВИТЬ ЦИФРЫ' in html and 'ПРОМПТЫ GEMINI' in html
          assert 'id="promptModal"' in html
          assert 'MutationObserver' not in html and '/static/' not in html

          original = app_module.db_conn
          app_module.db_conn = lambda: (_ for _ in ()).throw(RuntimeError('synthetic db outage'))
          try:
              assert c.head('/').status_code == 200
              assert c.get('/healthz').status_code == 200
          finally:
              app_module.db_conn = original

          print('V41 SINGLE RUNTIME OK')
          PY
