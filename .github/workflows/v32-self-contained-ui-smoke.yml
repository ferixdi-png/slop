name: V33 Fail-Open Browser Smoke

on:
  pull_request:
    paths:
      - 'frontend_failopen_v33.py'
      - 'radar_runtime_v27.py'
      - '.github/workflows/v32-self-contained-ui-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'frontend_failopen_v33.py'
      - 'radar_runtime_v27.py'
      - '.github/workflows/v32-self-contained-ui-smoke.yml'

jobs:
  fail-open-browser:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: v33-smoke
      APIFY_API_TOKEN: ''
      GEMINI_API_KEY: ''
      PORT: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt playwright
      - name: Compile and static fail-open contract
        run: |
          python -m compileall -q app.py frontend_failopen_v33.py radar_runtime_v27.py
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          import app as app_module
          from frontend_failopen_v33 import HTML

          c = app_module.app.test_client()
          root = c.get('/')
          assert root.status_code == 200
          body = root.get_data()
          html = body.decode('utf-8')
          assert len(body) > 20_000, len(body)
          assert root.headers['X-Frontend-Profile'] == 'frontend_v33_fail_open_single_runtime'
          assert root.headers['Cache-Control'].startswith('no-store')
          assert '/static/' not in html
          assert html.count('<script>') == 1
          assert html.count('</script>') == 1
          assert 'MutationObserver' not in html
          assert 'setInterval(' not in html
          assert 'V33 FAIL-OPEN SINGLE RUNTIME' in html
          assert 'Даже без JavaScript эта страница остаётся видимой' in html
          assert 'id="appShell"' in html

          # Root must remain available if SQLite is unavailable.
          original_db = app_module.db_conn
          def explode_db(*args, **kwargs):
              raise RuntimeError('ROOT_MUST_NOT_TOUCH_DB')
          app_module.db_conn = explode_db
          try:
              again = c.get('/')
              assert again.status_code == 200
              assert again.get_data() == body
          finally:
              app_module.db_conn = original_db

          health = c.get('/api/frontend-health')
          assert health.status_code == 200
          payload = health.get_json()
          assert payload['ok'] is True, payload
          assert payload['profile'] == 'frontend_v33_fail_open_single_runtime', payload
          assert payload['fail_open_dom'] is True, payload
          assert payload['single_js_runtime'] is True, payload
          assert payload['legacy_client_scripts'] == 0, payload
          assert payload['mutation_observers'] == 0, payload
          assert payload['parallel_polling_layers'] == 0, payload
          assert payload['external_static_dependencies'] == 0, payload
          assert payload['root_db_dependency'] is False, payload
          assert payload['html_bytes'] == len(body), payload

          runtime = app_module.RUNTIME_INFO
          assert runtime['frontend_profile'] == payload['profile'], runtime
          assert runtime['fail_open_dom'] is True, runtime
          assert runtime['single_js_runtime'] is True, runtime
          assert runtime['legacy_client_scripts'] == 0, runtime
          assert runtime['mutation_observers'] == 0, runtime
          assert runtime['parallel_polling_layers'] == 0, runtime

          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          assert script, 'single JS block missing'
          with tempfile.TemporaryDirectory() as td:
              js = Path(td) / 'frontend-v33.js'
              js.write_text(script.group(1), encoding='utf-8')
              subprocess.run(['node', '--check', str(js)], check=True)
          print('V33 STATIC FAIL-OPEN CONTRACT OK', payload)
          PY
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium + Gunicorn stability
        run: |
          set -euo pipefail
          gunicorn app:app --bind 0.0.0.0:10000 --workers 1 --threads 4 --timeout 900 >/tmp/v33-gunicorn.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:10000/api/frontend-health | python -m json.tool
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          api_requests = []
          initial_page_errors = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              page = context.new_page()
              page.on('request', lambda r: api_requests.append(r.url) if '/api/' in r.url else None)
              page.on('pageerror', lambda e: initial_page_errors.append(str(e)))
              response = page.goto('http://127.0.0.1:10000/', wait_until='domcontentloaded', timeout=30000)
              assert response and response.status == 200
              page.wait_for_function('window.__V33_LOADED__ === true', timeout=10000)
              hero = page.locator('h1')
              shell = page.locator('#appShell')
              assert hero.is_visible(), 'hero not visible after boot'
              assert shell.is_visible(), 'shell not visible after boot'
              box = shell.bounding_box()
              assert box and box['width'] > 900 and box['height'] > 600, box
              assert 'V33 · fail-open single runtime · JS готов' in page.locator('#runtimePill').inner_text()
              page.wait_for_timeout(12000)
              assert hero.is_visible(), 'hero disappeared after polling'
              assert shell.is_visible(), 'shell disappeared after polling'
              assert len(api_requests) <= 20, f'excessive API polling: {len(api_requests)} {api_requests}'
              assert not initial_page_errors, initial_page_errors

              # Network loss is a normal Render/browser failure mode. UI must remain.
              context.set_offline(True)
              page.wait_for_timeout(10000)
              assert hero.is_visible(), 'hero disappeared while offline'
              assert shell.is_visible(), 'shell disappeared while offline'
              context.set_offline(False)

              # An arbitrary later JS exception must surface visibly without blanking DOM.
              before = len(initial_page_errors)
              page.evaluate("setTimeout(() => { throw new Error('V33_SYNTHETIC_RUNTIME_ERROR') }, 0)")
              page.wait_for_timeout(800)
              assert len(initial_page_errors) > before, initial_page_errors
              assert page.locator('#runtimeError').is_visible(), 'runtime error not surfaced'
              assert 'V33_SYNTHETIC_RUNTIME_ERROR' in page.locator('#runtimeError').inner_text()
              assert hero.is_visible(), 'hero disappeared after runtime exception'
              assert shell.is_visible(), 'shell disappeared after runtime exception'
              page.screenshot(path='/tmp/v33-final.png', full_page=True)
              browser.close()
          print('V33 CHROMIUM FAIL-OPEN OK; API requests:', len(api_requests))
          PY
          kill -0 $PID
          echo 'Gunicorn + real Chromium stayed healthy.'
