name: Source Alias Smoke

on:
  push:
    branches: [fix/source-alias-720]
  workflow_dispatch:

jobs:
  alias-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Verify renamed Apify sources reach legacy candidate pipeline
        env:
          SECRET_KEY: smoke-test
        run: |
          python - <<'PY'
          import radar_request_job as r
          import radar_source_compat as compat

          compat.apply_source_alias_compat()
          assert getattr(r, '_SOURCE_ALIAS_COMPAT_APPLIED', False)

          original = r._SOURCE_ALIAS_ORIGINAL_COLLECT
          current_wrapper = r._collect_source_rows
          try:
              # Rebuild the wrapper around a deterministic fake collector so the
              # exact production alias mapping is exercised without Apify network.
              r._SOURCE_ALIAS_COMPAT_APPLIED = False
              compat._APPLIED = False
              r._collect_source_rows = lambda client, job: {
                  'popular_ai': [{'id': f'p{i}'} for i in range(65)],
                  'ai_hashtags': [{'id': f'h{i}'} for i in range(389)],
                  'ai_keywords': [{'id': f'k{i}'} for i in range(264)],
                  'known_ai_creators': [{'id': 'c1'}, {'id': 'c2'}],
              }
              compat.apply_source_alias_compat()
              aliased = r._collect_source_rows(None, {})
              assert len(aliased['popular']) == 65
              assert len(aliased['hashtags']) == 653
              assert len(aliased['creators']) == 2
              assert len(aliased['popular']) + len(aliased['hashtags']) + len(aliased['creators']) == 720
              print('alias bridge OK:', {k: len(aliased[k]) for k in ('popular','hashtags','creators')})
          finally:
              r._collect_source_rows = current_wrapper
              r._SOURCE_ALIAS_ORIGINAL_COLLECT = original
              r._SOURCE_ALIAS_COMPAT_APPLIED = True
              compat._APPLIED = True
          PY
      - name: Verify app imports bridge before mass profile
        env:
          SECRET_KEY: smoke-test
        run: |
          python - <<'PY'
          import app
          import radar_request_job as r
          assert getattr(r, '_SOURCE_ALIAS_COMPAT_APPLIED', False)
          assert app.app is not None
          assert app.RADAR_RUNTIME == 'request_state_machine_v5'
          print('app import + source bridge OK')
          PY
