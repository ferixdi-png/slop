name: V41 Real Chrome Prompt Modal Smoke

on:
  pull_request:
    paths:
      - 'product_finish_v41.py'
      - 'gemini_overload_v40.py'
      - 'frontend_failopen_v33.py'
      - 'frontend_broad_v34.py'
      - 'frontend_manual_start_v35.py'
      - 'metrics_truth_v40.py'
      - '.github/workflows/v41-prompt-modal-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'product_finish_v41.py'
      - 'gemini_overload_v40.py'
      - '.github/workflows/v41-prompt-modal-browser-smoke.yml'

jobs:
  real-chrome-prompt-modal:
    runs-on: ubuntu-latest
    env:
      DB_PATH: /tmp/slop-v41-browser.sqlite
      SECRET_KEY: v41-browser-smoke
      APIFY_API_TOKEN: ''
      GEMINI_API_KEY: ''
      PORT: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt playwright
      - name: Verify system Chrome
        run: google-chrome --version
      - name: Click, copy, close and reopen modal in real Chrome
        run: |
          set -euo pipefail
          rm -f /tmp/slop-v41-browser.sqlite /tmp/slop-v41-browser.sqlite-wal /tmp/slop-v41-browser.sqlite-shm
          gunicorn app:app --bind 0.0.0.0:10000 --workers 1 --threads 4 --timeout 900 >/tmp/v41-browser-gunicorn.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/healthz >/dev/null; then break; fi
            sleep 0.5
          done

          python - <<'PY'
          import json
          from playwright.sync_api import sync_playwright

          page_errors = []
          api_posts = []
          analyze_calls = {'n': 0}

          radar_rows = [
              {
                  'id': 1001,
                  'platform': 'Instagram Reels',
                  'creator': 'browser1',
                  'post_url': 'https://www.instagram.com/reel/V41BROWSER1/',
                  'duration_sec': 8.0,
                  'views': 290000,
                  'likes': 5000,
                  'comments': 100,
                  'hours_since_publish': 1.0,
                  'views_per_hour': 250000,
                  'measured_growth_per_hour': 0,
                  'viral_score_v2': 94,
                  'search_term': 'ai',
                  'hook': 'Browser trend 1',
                  'scene_description': 'Visible synthetic browser trend 1',
                  'adaptation_label': 'ТРЕНД-КАНДИДАТ',
                  'adaptation_status': 'NOT_ENRICHED',
                  'trend_pool': True,
                  'speech_required_for_top': False,
                  'ai_role': 'enrichment_only',
              },
              {
                  'id': 1002,
                  'platform': 'Instagram Reels',
                  'creator': 'browser2',
                  'post_url': 'https://www.instagram.com/reel/V41BROWSER2/',
                  'duration_sec': 8.0,
                  'views': 280000,
                  'likes': 4800,
                  'comments': 90,
                  'hours_since_publish': 1.2,
                  'views_per_hour': 230000,
                  'measured_growth_per_hour': 0,
                  'viral_score_v2': 92,
                  'search_term': 'ai',
                  'hook': 'Browser trend 2',
                  'scene_description': 'Visible synthetic browser trend 2',
                  'adaptation_label': 'ТРЕНД-КАНДИДАТ',
                  'adaptation_status': 'NOT_ENRICHED',
                  'trend_pool': True,
                  'speech_required_for_top': False,
                  'ai_role': 'enrichment_only',
              },
          ]

          def radar_route(route):
              route.fulfill(
                  status=200,
                  content_type='application/json',
                  body=json.dumps(radar_rows, ensure_ascii=False),
              )

          def analyze_route(route):
              analyze_calls['n'] += 1
              n = analyze_calls['n']
              photo = f'PHOTO PROMPT BROWSER {n}: ultra realistic vertical 9:16 Frame 0 ' + ('x' * 120)
              video = f'VIDEO PROMPT BROWSER {n}: use Frame 0, exact action sequence. AUDIO / VOICE / RUSSIAN SPEECH: natural line ' + ('y' * 160)
              route.fulfill(
                  status=200,
                  content_type='application/json',
                  body=json.dumps({
                      'id': 9000+n,
                      'model': 'synthetic-browser',
                      'source_mode': 'metadata_gemini',
                      'creator': f'browser{n}',
                      'platform': 'Instagram Reels',
                      'trend_title': f'Browser modal trend {n}',
                      'result': {'photo_prompt': photo, 'video_prompt': video},
                  }, ensure_ascii=False),
              )

          with sync_playwright() as p:
              browser = p.chromium.launch(channel='chrome')
              context = browser.new_context(viewport={'width': 1440, 'height': 1000})
              context.grant_permissions(['clipboard-read','clipboard-write'], origin='http://127.0.0.1:10000')
              page = context.new_page()
              page.on('pageerror', lambda e: page_errors.append(str(e)))
              page.on('request', lambda r: api_posts.append(r.url) if r.method.upper()=='POST' and '/api/' in r.url else None)
              page.route('**/api/radar', radar_route)
              page.route('**/api/radar/*/analyze', analyze_route)

              response = page.goto('http://127.0.0.1:10000/', wait_until='domcontentloaded', timeout=30000)
              assert response and response.status == 200
              page.wait_for_function('window.__V35_MANUAL_START__ === true', timeout=10000)
              page.locator('[data-analyze]').first.wait_for(state='visible', timeout=10000)
              assert page.locator('[data-analyze]').count() == 2
              assert api_posts == [], api_posts
              assert not page.locator('#promptModal').is_visible()

              # Trend 1 -> modal -> exactly two cards -> clipboard works.
              page.locator('[data-analyze]').nth(0).click()
              page.locator('#promptModalContent').wait_for(state='visible', timeout=10000)
              assert page.locator('#promptModal').is_visible()
              assert page.locator('#promptModalContent .prompt-card').count() == 2
              assert 'PHOTO PROMPT BROWSER 1' in page.locator('#promptModalContent .prompt-card').nth(0).inner_text()
              assert 'VIDEO PROMPT BROWSER 1' in page.locator('#promptModalContent .prompt-card').nth(1).inner_text()
              assert 'AUDIO / VOICE / RUSSIAN SPEECH' in page.locator('#promptModalContent .prompt-card').nth(1).inner_text()
              copy = page.locator('#promptModalContent .prompt-card').nth(0).locator('[data-copy]')
              copy.click()
              page.wait_for_function("document.querySelector('#promptModalContent .prompt-card [data-copy]').textContent==='СКОПИРОВАНО'", timeout=5000)
              clipboard = page.evaluate('navigator.clipboard.readText()')
              assert 'PHOTO PROMPT BROWSER 1' in clipboard, clipboard

              # Close by X, then open a different trend without navigation.
              page.locator('[data-prompt-close]').click()
              assert not page.locator('#promptModal').is_visible()
              page.locator('[data-analyze]').nth(1).click()
              page.locator('#promptModalContent').wait_for(state='visible', timeout=10000)
              assert 'Browser modal trend 2' in page.locator('#promptModalTitle').inner_text()
              assert 'PHOTO PROMPT BROWSER 2' in page.locator('#promptModalContent').inner_text()

              # Escape closes; third open can be closed by clicking backdrop.
              page.keyboard.press('Escape')
              assert not page.locator('#promptModal').is_visible()
              page.locator('[data-analyze]').nth(0).click()
              page.locator('#promptModalContent').wait_for(state='visible', timeout=10000)
              page.locator('#promptModal').click(position={'x': 4, 'y': 4})
              assert not page.locator('#promptModal').is_visible()

              assert analyze_calls['n'] == 3, analyze_calls
              assert len(api_posts) == 3, api_posts
              assert not page_errors, page_errors
              assert page.locator('#appShell').is_visible()
              browser.close()

          print('V41 REAL CHROME PROMPT MODAL OK')
          PY

          kill -0 $PID
          echo '--- V41 GUNICORN TAIL ---'
          tail -n 80 /tmp/v41-browser-gunicorn.log
