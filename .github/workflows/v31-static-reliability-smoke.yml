name: Legacy Static Isolation Smoke

on:
  pull_request:
    paths:
      - 'static_reliability_v31.py'
      - 'gunicorn.conf.py'
      - 'templates/index.html'
      - 'static/**'
      - '.github/workflows/v31-static-reliability-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'static_reliability_v31.py'
      - 'gunicorn.conf.py'
      - 'templates/index.html'
      - 'static/**'
      - '.github/workflows/v31-static-reliability-smoke.yml'

jobs:
  static-isolation:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: static-isolation-smoke
      APIFY_API_TOKEN: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app.py static_reliability_v31.py gunicorn.conf.py
      - name: Verify legacy static tooling cannot control production boot
        run: |
          python - <<'PY'
          import runpy
          import app as app_module
          from static_reliability_v31 import CRITICAL_ASSETS, install_static_reliability

          # Legacy assets may remain available for diagnostics/backward compatibility,
          # but the current production worker must not install them automatically.
          conf = runpy.run_path('gunicorn.conf.py')
          assert 'post_worker_init' not in conf, conf.keys()
          assert conf['bind'].startswith('0.0.0.0:')
          assert conf['timeout'] == 900

          c = app_module.app.test_client()
          root_before = c.get('/')
          assert root_before.status_code == 200
          html_before = root_before.get_data(as_text=True)
          assert '/static/' not in html_before
          assert root_before.headers['X-Frontend-Profile'] == 'frontend_v34_broad_fail_open'

          # The old utility itself must remain harmless if explicitly invoked by a
          # developer: it can serve legacy assets but may not alter the live root.
          health = install_static_reliability(app_module.app)
          assert health['ok'] is True, health
          assert set(CRITICAL_ASSETS) == set(health['assets']), health
          assert all(int(meta['bytes']) > 0 for meta in health['assets'].values()), health

          root_after = c.get('/')
          assert root_after.status_code == 200
          assert root_after.get_data() == root_before.get_data()
          assert '/static/' not in root_after.get_data(as_text=True)
          print('LEGACY STATIC ISOLATED FROM PRODUCTION BOOT')
          PY
