name: Apify Start Compat Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  apify-start-compat:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: compat-smoke
      APIFY_API_TOKEN: ""
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify restart_on_error is stripped but caps survive
        run: |
          python - <<'PY'
          from decimal import Decimal
          from apify_client import ApifyClient
          from apify_start_compat import install_apify_start_compat

          assert install_apify_start_compat() is True
          actor = ApifyClient('compat-smoke').actor('apify/instagram-scraper')
          cls = type(actor)
          assert getattr(cls, '_slop_restart_on_error_compat', False) is True

          captured = {}
          original = cls._slop_original_start
          def fake_start(self, *args, **kwargs):
              captured.update(kwargs)
              return {'id': 'fake-run', 'status': 'READY'}
          cls._slop_original_start = fake_start
          try:
              result = actor.start(
                  run_input={'directUrls': ['https://www.instagram.com/explore/tags/ai/']},
                  max_items=250,
                  max_total_charge_usd=Decimal('1.00'),
                  restart_on_error=False,
              )
          finally:
              cls._slop_original_start = original

          assert result['id'] == 'fake-run'
          assert 'restart_on_error' not in captured, captured
          assert captured['max_items'] == 250, captured
          assert captured['max_total_charge_usd'] == Decimal('1.00'), captured
          print('Apify ActorClient.start compatibility OK')
          PY
      - name: Verify V28 bootstrap exposes compatibility guard
        run: |
          python - <<'PY'
          import app
          import radar_multiplatform_v28 as v28
          import radar_runtime_v27

          status = app.app.test_client().get('/api/status').get_json()
          assert status.get('radar_runtime') == v28.MODE_VERSION, status
          contract = radar_runtime_v27.activate_v27_runtime()
          assert contract.get('apify_start_compat') is True, contract
          assert contract.get('hashtags') == ['omni', 'veo', 'veo3', 'ai', 'ии'], contract
          assert contract.get('platforms') == ['Instagram Reels', 'TikTok', 'YouTube Shorts'], contract
          assert contract.get('lookback_days') == 14, contract
          print('V28 contract OK')
          PY
