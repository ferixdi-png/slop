name: Smoke Check
on:
  push:
    branches: [main, fix/radar-request-state-machine, fix/more-10s-ai-reels, fix-apify-quota-v10, fix-highfreq-v13-kling, fix-dialogue-first-v14]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Dialogue-first radar, budget and quota-fallback smoke
        env:
          SECRET_KEY: smoke-test
        run: |
          python - <<'PY'
          import app as app_module
          import radar_request_job as radar_job
          import radar_service, gemini_service, cloud_state
          from radar_budget_v10 import budget_breakdown, ACTOR_CAPS_USD
          from radar_dialogue_v14 import PROFILE_VERSION, matches_dialogue_first, top_eligible_dialogue
          from progress import set_radar_status
          from models import RadarAssessment

          c=app_module.app.test_client()
          for path in ['/health','/api/status','/api/radar/status','/api/radar','/api/radar/candidates']:
              r=c.get(path); assert r.status_code==200,(path,r.status_code,r.get_data(as_text=True))

          status=c.get('/api/status').get_json()
          assert status['radar_profile']==PROFILE_VERSION
          assert status['radar_keep_limit']==60
          assert status['radar_duration_min']==1.0 and status['radar_duration_max']==10.05
          assert radar_job.RADAR_AI_ANALYZE_LIMIT==420

          budget=budget_breakdown()
          assert budget['guarded_apify_usd'] <= 4.00, budget
          assert budget['hard_apify_actor_caps_usd'] <= 3.35, budget
          assert budget['designed_total_budget_usd'] <= 5.00, budget
          assert budget['hard_budget_usd'] == 5.0
          assert round(sum(ACTOR_CAPS_USD.values()),2) <= 3.35

          sources=radar_job._build_sources()
          assert {'popular_ai','ai_hashtags','ai_keywords'}<=set(sources)
          assert sources['popular_ai']['input']['searchLimit']==20
          tags=sources['ai_hashtags']['input']['hashtags']
          for required in ['ai','ии','grok','veo','omni','kling','seedance','юмор','приколы','скетч','comedy','funny']:
              assert required in tags, (required,tags)
          search_text=sources['popular_ai']['input']['search'].lower()
          for phrase in ['смешной диалог','короткий скетч','funny dialogue','comedy skit','kling']:
              assert phrase in search_text, (phrase,search_text)

          # Ordinary REAL comedy dialogue must PASS even when is_ai_video=False.
          real_dialogue=RadarAssessment(
              is_russian=True,is_ai_video=False,is_comedy_scene=True,
              is_tutorial_or_review=False,is_talking_head=False,simple_situation=True,
              strong_first_frame=True,one_clear_joke_or_twist=True,characters_count=2,
              scene_description='husband wife joke',characters=['man','woman'],joke='funny answer',
              hook='question',ending='punchline',reproducible_format=True,reason='reusable dialogue',
              has_spoken_dialogue=True,dialogue_is_comedic=True,dialogue_summary='question and punchline',
              detected_language='Russian')
          assert matches_dialogue_first(real_dialogue) is True
          assert radar_service.matches(real_dialogue) is True

          # Foreign funny dialogue also PASS because production localizes it to Russian.
          foreign_dialogue=real_dialogue.model_copy(update={'is_russian':False,'detected_language':'English'})
          assert matches_dialogue_first(foreign_dialogue) is True

          # Informational real talking head with no comedic dialogue must REJECT.
          info_head=RadarAssessment(
              is_russian=True,is_ai_video=False,is_comedy_scene=False,
              is_tutorial_or_review=True,is_talking_head=True,simple_situation=True,
              strong_first_frame=False,one_clear_joke_or_twist=False,characters_count=1,
              scene_description='expert explains app',characters=['expert'],joke='',hook='',ending='',
              reproducible_format=True,reason='tutorial',has_spoken_dialogue=True,
              dialogue_is_comedic=False,dialogue_summary='explanation',detected_language='Russian')
          assert matches_dialogue_first(info_head) is False

          # AI visual gag remains valid as secondary discovery even without dialogue.
          ai_gag=RadarAssessment(
              is_russian=False,is_ai_video=True,is_comedy_scene=True,
              is_tutorial_or_review=False,is_talking_head=False,simple_situation=True,
              strong_first_frame=True,one_clear_joke_or_twist=True,characters_count=1,
              scene_description='AI gag',characters=['AI character'],joke='gag',hook='hook',ending='reaction',
              reproducible_format=True,reason='adaptable',has_spoken_dialogue=False,
              dialogue_is_comedic=False,dialogue_summary='',detected_language='none')
          assert matches_dialogue_first(ai_gag) is True

          # Gemini PASS should stay visible even with weak metrics; metrics only rank S/A/B/C.
          assert top_eligible_dialogue({'duration_sec':7.4,'views':120,'likes':1,'viral_score_v2':3}) is True
          assert top_eligible_dialogue({'duration_sec':10.2,'views':1000000,'likes':10000,'viral_score_v2':99}) is False
          assert 'RUSSIAN LOCALIZATION OVERRIDE' in gemini_service.production_system_prompt(False,8.0)

          calls=[]
          class FakeActor:
              def start(self, **kwargs):
                  calls.append(kwargs)
                  return {'id':'run-1','status':'READY','defaultDatasetId':'ds-1'}
          class FakeClient:
              def actor(self, actor_id): return FakeActor()
          job={'run_id':'smoke','phase':'queued','profile':PROFILE_VERSION,'sources':sources,'candidates':[],'stats':{},'result':{},'error':''}
          radar_job._persist=lambda j:j
          radar_job._start_one_source(FakeClient(),job)
          assert calls, 'Actor was not started'
          assert calls[0]['max_total_charge_usd'] is not None
          assert float(calls[0]['max_total_charge_usd']) <= 1.35
          assert calls[0]['max_items'] > 0
          assert calls[0]['restart_on_error'] is False

          original_store=cloud_state._store_client
          cloud_state._store_client=lambda: None
          probe={'phase':'queued','run_id':'local-fallback-smoke'}
          assert cloud_state.save_cloud_record('SMOKE_LOCAL',probe) is True
          assert cloud_state.load_cloud_record('SMOKE_LOCAL')==probe
          cloud_state.delete_cloud_record('SMOKE_LOCAL')
          cloud_state._store_client=original_store

          set_radar_status('ready','Готов к поиску',0,None,'local-only-status')
          assert c.get('/api/radar/status').get_json()['message']=='local-only-status'

          def fake_start(): return ({'ok':True,'active':True,'accepted':True,'completed':False,'resumed':False,'run_id':'smoke-run','phase':'queued'},202)
          def fake_tick(): return ({'ok':True,'active':True,'run_id':'smoke-run','phase':'discovering'},200)
          rs,rt=app_module.create_or_resume_job,app_module.tick_job
          app_module.create_or_resume_job=fake_start; app_module.tick_job=fake_tick
          assert c.post('/api/radar/sync').status_code==202
          assert c.post('/api/radar/tick').get_json()['phase']=='discovering'
          app_module.create_or_resume_job=rs; app_module.tick_job=rt
          print('DIALOGUE-FIRST V14 BUDGET SMOKE OK',budget)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/runtime.js
      - name: Verify frontend contract
        run: |
          grep -q "/api/radar/sync" static/runtime.js
          grep -q "/api/radar/tick" static/runtime.js
          grep -q "request_state_machine_v5" radar_request_job.py
          grep -q "dialogue_first_v14_core5" radar_dialogue_v14.py
