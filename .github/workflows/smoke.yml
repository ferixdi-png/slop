name: Smoke Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: V29 budget product plus V19 edge hardening smoke
        env:
          SECRET_KEY: smoke-test
          PORT: '10000'
        run: |
          python - <<'PY'
          import subprocess
          from datetime import datetime, timedelta, timezone

          import app as app_module
          import gemini_service
          import radar_budget_v29 as v29
          import radar_cancel_v18 as cancel
          import radar_edge_v19 as edge
          import radar_hardening_v19 as hardening
          import radar_multiplatform_v28 as v28
          import radar_request_job as radar_job
          import radar_runtime_v27 as runtime
          from cloud_state import load_radar_cancel_request, load_radar_job, save_radar_job
          from db import ResilientConnection, db_conn
          from static_video_gate import ffmpeg_executable, inspect_visual_motion

          c = app_module.app.test_client()
          for path in ['/health','/api/status','/api/radar/status','/api/radar/job','/api/radar','/api/radar/candidates']:
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code, r.get_data(as_text=True))

          status = c.get('/api/status').get_json()
          assert status['radar_runtime'] == v29.MODE_VERSION, status
          assert status['radar_profile'] == v29.MODE_VERSION, status
          assert status['edge_profile'] == v29.MODE_VERSION, status
          assert app_module.PROFILE_VERSION == v29.SCREENING_PROFILE
          assert hardening.PROFILE_VERSION == v29.SCREENING_PROFILE
          assert app_module.RUNTIME_INFO['internal_screening_profile'] == v29.SCREENING_PROFILE
          assert app_module.RUNTIME_INFO['internal_edge'] == edge.EDGE_PROFILE
          assert status['radar_keep_limit'] == 180
          assert radar_job.RADAR_AI_ANALYZE_LIMIT == 150

          # Hard spend contract: discovery cannot exceed $2.80 and the full design target is <$5.
          b = v29.budget_breakdown_v29()
          assert b['hard_total_target_usd'] == 5.0, b
          assert b['hard_apify_discovery_caps_usd'] <= 2.80, b
          assert b['reserved_headroom_usd'] >= 2.20, b
          assert b['results_per_tag_per_platform'] == 60, b
          assert b['max_items_per_platform'] == 300, b
          assert b['max_raw_requested'] == 900, b
          assert b['gemini_analyze_limit'] == 150, b
          assert sum(b['source_caps_usd'].values()) <= 2.80, b

          # SQLite lock/profile hardening survives V29.
          with db_conn() as conn:
              assert isinstance(conn, ResilientConnection)
              assert int(conn.execute('PRAGMA busy_timeout').fetchone()[0]) >= 60000
              cols = {row[1] for row in conn.execute('PRAGMA table_info(radar_posts)').fetchall()}
              assert {'screening_profile','platform','measured_growth_per_hour','growth_acceleration'} <= cols

          # Durable STOP marker still wins without waiting for a long tick.
          started = c.post('/api/radar/sync')
          assert started.status_code == 202, started.get_data(as_text=True)
          run_id = started.get_json()['run_id']
          assert radar_job._tick_lock.acquire(blocking=False)
          try:
              pending, code = cancel.cancel_active_job(wait_seconds=0)
              assert code == 202 and pending['stop_pending'] is True, pending
              marker = load_radar_cancel_request()
              assert marker and marker['run_id'] == run_id, marker
          finally:
              radar_job._tick_lock.release()
          stopped = c.post('/api/radar/tick').get_json()
          assert stopped['active'] is False and stopped['phase'] == 'cancelled', stopped

          # A stale pre-V29 queue resets before paid work and receives capped sources.
          c.post('/api/radar/sync')
          stale = load_radar_job()
          stale['profile'] = 'old-v28-profile'
          stale['phase'] = 'ai'
          stale['candidates'] = [{'post_url':'https://example.invalid/old','ai_done':False}]
          save_radar_job(stale)
          migrated = c.post('/api/radar/sync')
          assert migrated.status_code == 202
          migrated_job = load_radar_job()
          assert migrated_job['profile'] == v29.SCREENING_PROFILE, migrated_job
          assert migrated_job['phase'] == 'queued', migrated_job
          assert set(migrated_job['sources']) == {'instagram','tiktok','youtube'}, migrated_job
          for name, source in migrated_job['sources'].items():
              assert source['max_items'] == 300, source
              assert source['max_total_charge_usd'] == v29.SOURCE_CHARGE_CAPS_USD[name], source
              assert source['strict_scope_marker'] == v29.SOURCE_MARKER, source
          c.post('/api/radar/stop')

          # Same backend error still has a finite retry circuit breaker.
          c.post('/api/radar/sync')
          guarded = None
          for _ in range(hardening.MAX_SAME_TICK_ERRORS):
              guarded = hardening._apply_tick_error_guard({
                  'active': True, 'transient_error': True,
                  'message': 'synthetic identical transport failure',
              })
          assert guarded['retry_budget_exceeded'] is True, guarded
          assert load_radar_job()['phase'] == 'failed'

          # Old-profile PASS cannot leak into current TOP.
          stale_url = 'https://example.com/old-pass'
          with db_conn() as conn:
              conn.execute(
                  """INSERT OR REPLACE INTO radar_posts(
                       platform,creator,post_url,published_at,duration_sec,views,likes,comments,
                       hours_since_publish,views_per_hour,viral_score_v2,search_term,
                       ai_checked,ai_match,screening_profile,reason
                     ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                  ('Instagram Reels','old',stale_url,datetime.now(timezone.utc).isoformat(),8.0,
                   999999,9999,999,1.0,999999,99.0,'ai',1,1,'old-profile','OLD_PASS'),
              )
              conn.commit()
          assert stale_url not in {x.get('post_url') for x in c.get('/api/radar').get_json()}

          # Static card is rejected locally before speech Gemini.
          ffmpeg = ffmpeg_executable()
          assert ffmpeg
          subprocess.run([
              ffmpeg, '-y', '-loglevel', 'error', '-f', 'lavfi',
              '-i', 'color=c=blue:s=320x240:r=30:d=4',
              '-c:v', 'mpeg4', '-q:v', '5', '/tmp/static.mp4'
          ], check=True)
          still = inspect_visual_motion('/tmp/static.mp4')
          assert still.checked and still.is_static_image_video, still
          verdict = v28.classify_file_v28('/tmp/static.mp4', '#ai', 'Instagram Reels')
          assert verdict.reason.startswith('REJECT_STATIC_IMAGE'), verdict

          # Production reconstruction locks remain untouched underneath V29.
          prod = gemini_service.production_system_prompt(False, 7.64)
          forensic = gemini_service.forensic_system_prompt(False, 7.64)
          audit = gemini_service.audit_system_prompt(7.64)
          assert 'FRAME 0 PHOTO PROMPT — ABSOLUTE LITERAL LOCK' in prod
          assert 'EXACT VIDEO DURATION — ABSOLUTE LOCK' in prod
          assert 'CAPCUT OVERLAY PLAN' in prod
          assert 'RUSSIAN PUBLICATION LOCALIZATION — ABSOLUTE' in prod
          assert 'timestamp 0.000 seconds' in forensic
          assert 'frame_zero_literal_match_ok' in audit
          assert 'explicit_duration_instruction_ok' in audit

          print('V29 BUDGET PRODUCT + V19 EDGE HARDENING OK', runtime.RUNTIME_VERSION, b)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend contract
        run: |
          node --check static/app.js
          node --check static/overlay_v15.js
          node --check static/runtime.js
          node --check static/scope_v24.js
          grep -q "/api/radar/job" static/runtime.js
          grep -q "/api/radar/stop" static/runtime.js
          grep -q "id=\"stopRadar\"" templates/index.html
          grep -q "screening_profile" db.py
          grep -q "multiplatform_speech_v29_budget5" radar_budget_v29.py
          grep -q "HARD BUDGET" templates/index.html
          grep -q "#omni + #veo + #veo3 + #ai + #ии" templates/index.html
