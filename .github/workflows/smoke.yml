name: Smoke Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Flask smoke test
        env:
          SECRET_KEY: smoke-test
        run: |
          python - <<'PY'
          import app as app_module
          from progress import set_radar_status

          c = app_module.app.test_client()
          for path in ['/health', '/api/status', '/api/radar/status', '/api/radar', '/api/radar/candidates']:
              r = c.get(path)
              print(path, r.status_code, r.content_type)
              assert r.status_code == 200, (path, r.status_code, r.get_data(as_text=True))

          def fake_sync_radar():
              result = {'raw': 3, 'after_numeric_filter': 2, 'ai_checked': 1, 'matched': 1, 'kept': 1}
              set_radar_status('done', 'Поиск завершён', 100, 0, 'Smoke radar completed.', details=result)
              return result

          def fake_persistent_start():
              return ({
                  'ok': True,
                  'accepted': True,
                  'completed': False,
                  'run_id': 'smoke-persistent-run',
                  'phase': 'queued',
              }, 202)

          # Old synchronous route uses sync_radar; the durable route uses
          # start_or_resume_radar. Keeping both fakes makes CI safe during the
          # migration commit and verifies either HTTP contract explicitly.
          app_module.sync_radar = fake_sync_radar
          app_module.start_or_resume_radar = fake_persistent_start

          r = c.post('/api/radar/sync')
          print('/api/radar/sync', r.status_code, r.get_json())
          assert r.status_code in (200, 202)
          payload = r.get_json()
          assert payload['ok'] is True
          if r.status_code == 200:
              assert payload['completed'] is True
          else:
              assert payload['accepted'] is True and payload['completed'] is False
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/runtime.js
