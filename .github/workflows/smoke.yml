name: Smoke Check
on:
  push:
    branches: [main, fix-radar-v17, fix-force-stop-v18]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .

      - name: V17 radar behavior, force stop, static gate and budget
        env:
          SECRET_KEY: smoke-test
        run: |
          python - <<'PY'
          import subprocess
          import app as app_module
          import gemini_service
          import radar_budget_v10 as budget_module
          import radar_growth_v6 as growth
          import radar_request_job as radar_job
          import radar_service
          import radar_scale_v16 as scale
          import radar_resilient_v17 as v17
          from static_video_gate import ffmpeg_executable, inspect_visual_motion

          c = app_module.app.test_client()
          for path in ['/health','/api/status','/api/radar/status','/api/radar','/api/radar/candidates']:
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code, r.get_data(as_text=True))

          status = c.get('/api/status').get_json()
          assert status['radar_profile'] == v17.PROFILE_VERSION, status
          assert v17.PROFILE_VERSION == 'dialogue_trends_v17_resilient_budget5'
          assert status['radar_keep_limit'] == v17.KEEP_LIMIT == 180
          assert radar_job.RADAR_AI_ANALYZE_LIMIT == v17.GEMINI_ANALYZE_LIMIT == 420
          assert gemini_service.classify_radar_video is v17.classify_v17
          assert radar_service.matches is v17.matches_v17
          assert radar_job._process_one_ai is v17._process_one_v17
          assert growth._ORIGINAL_FINALIZE is scale.finalize_scale_v16
          assert len(v17.RadarScreeningV17.model_fields) <= 12
          assert v17.MAX_CLASSIFICATION_OUTPUT_TOKENS == 320

          b = budget_module.budget_breakdown()
          assert b['guarded_apify_usd'] <= 4.00, b
          assert b['hard_apify_actor_caps_usd'] <= 3.35, b
          assert b['designed_total_budget_usd'] <= 5.00, b
          assert b['hard_budget_usd'] == 5.0, b

          # Force-stop contract: create a durable run, cancel it, confirm ticks no
          # longer advance it, then ensure a brand-new run can be created.
          started = c.post('/api/radar/sync')
          assert started.status_code == 202, started.get_data(as_text=True)
          started_json = started.get_json()
          old_run_id = started_json['run_id']
          assert started_json['active'] is True

          stopped = c.post('/api/radar/stop')
          assert stopped.status_code == 200, stopped.get_data(as_text=True)
          stopped_json = stopped.get_json()
          assert stopped_json['cancelled'] is True, stopped_json
          assert stopped_json['active'] is False, stopped_json
          assert stopped_json['phase'] == 'cancelled', stopped_json

          after_stop_tick = c.post('/api/radar/tick')
          assert after_stop_tick.status_code == 200, after_stop_tick.get_data(as_text=True)
          after_stop_json = after_stop_tick.get_json()
          assert after_stop_json['active'] is False, after_stop_json
          assert after_stop_json['phase'] == 'cancelled', after_stop_json

          restarted = c.post('/api/radar/sync')
          assert restarted.status_code == 202, restarted.get_data(as_text=True)
          restarted_json = restarted.get_json()
          assert restarted_json['active'] is True, restarted_json
          assert restarted_json['run_id'] != old_run_id, restarted_json
          # Clean up the smoke run too.
          stopped_again = c.post('/api/radar/stop')
          assert stopped_again.status_code == 200, stopped_again.get_data(as_text=True)

          # High recall: ordinary real funny speech passes; AI origin is irrelevant.
          ok = v17.RadarScreeningV17(
              has_spoken_dialogue=True, dialogue_is_comedic=True,
              is_tutorial_or_review=False, is_information_talking_head=False,
              is_static_or_slideshow=False, is_reusable_scene=True,
              dialogue_confidence=92, comedy_confidence=88,
              detected_language='English', dialogue_summary='question then funny answer',
              scene_summary='two people exchange a short joke', decision_code='PASS_DIALOGUE')
          assessment = v17._assessment_from_screening(ok)
          assert v17.matches_v17(assessment) is True
          assert assessment.is_russian is False

          no_speech = ok.model_copy(update={
              'has_spoken_dialogue': False, 'dialogue_is_comedic': False,
              'dialogue_confidence': 0, 'comedy_confidence': 0,
              'decision_code': 'NO_SPOKEN_DIALOGUE'})
          assert v17.matches_v17(v17._assessment_from_screening(no_speech)) is False

          tutorial = ok.model_copy(update={
              'is_tutorial_or_review': True, 'decision_code': 'TUTORIAL_OR_REVIEW'})
          assert v17.matches_v17(v17._assessment_from_screening(tutorial)) is False

          static_model = ok.model_copy(update={
              'is_static_or_slideshow': True, 'decision_code': 'STATIC_OR_SLIDESHOW'})
          assert v17.matches_v17(v17._assessment_from_screening(static_model)) is False

          # Static MP4 must be rejected locally with no GEMINI_API_KEY.
          ffmpeg = ffmpeg_executable()
          assert ffmpeg, 'No system or bundled ffmpeg available'
          subprocess.run([
              ffmpeg, '-y', '-loglevel', 'error', '-f', 'lavfi',
              '-i', 'color=c=blue:s=320x240:r=30:d=4',
              '-c:v', 'mpeg4', '-q:v', '5', '/tmp/static.mp4'
          ], check=True)
          subprocess.run([
              ffmpeg, '-y', '-loglevel', 'error', '-f', 'lavfi',
              '-i', 'testsrc2=size=320x240:rate=30:duration=4',
              '-c:v', 'mpeg4', '-q:v', '5', '/tmp/moving.mp4'
          ], check=True)
          still = inspect_visual_motion('/tmp/static.mp4')
          moving = inspect_visual_motion('/tmp/moving.mp4')
          assert still.checked and still.is_static_image_video, still
          assert moving.checked and not moving.is_static_image_video, moving
          verdict = v17.classify_v17('/tmp/static.mp4', 'text card')
          assert verdict.reason.startswith('REJECT_STATIC_IMAGE'), verdict

          # Discovery must now be the targeted v16 dialogue/comedy source mix.
          sources = radar_job._build_sources()
          tags = sources['ai_hashtags']['input']['hashtags']
          for required in ['юмор','приколы','comedy','funny','skit','ai','grok','veo','omni','kling']:
              assert required in tags, (required, tags)
          search_text = sources['popular_ai']['input']['search'].lower()
          for phrase in ['смешной диалог','смешная сценка','funny dialogue','couple comedy','family comedy']:
              assert phrase in search_text, (phrase, search_text)

          # Production locks remain intact.
          prod = gemini_service.production_system_prompt(False, 7.64)
          forensic = gemini_service.forensic_system_prompt(False, 7.64)
          audit = gemini_service.audit_system_prompt(7.64)
          assert 'FRAME 0 PHOTO PROMPT — ABSOLUTE LITERAL LOCK' in prod
          assert 'EXACT VIDEO DURATION — ABSOLUTE LOCK' in prod
          assert 'CAPCUT OVERLAY PLAN' in prod
          assert 'RUSSIAN PUBLICATION LOCALIZATION — ABSOLUTE' in prod
          assert 'timestamp 0.000 seconds' in forensic
          assert 'frame_zero_literal_match_ok' in audit
          assert 'explicit_duration_instruction_ok' in audit
          assert 'publication_russian_ok' in audit

          print('V18 STOP + V17 RADAR OK', status['radar_profile'], b)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend contract
        run: |
          node --check static/app.js
          node --check static/overlay_v15.js
          node --check static/runtime.js
          grep -q "/api/radar/sync" static/runtime.js
          grep -q "/api/radar/tick" static/runtime.js
          grep -q "/api/radar/stop" static/runtime.js
          grep -q "id=\"stopRadar\"" templates/index.html
          grep -q "dialogue_trends_v17_resilient_budget5" radar_resilient_v17.py
          grep -q "force_stop_v18" radar_cancel_v18.py
          grep -q "frame0_cleanplate_capcut_ru_v15" overlay_cleanplate_v15.py
          grep -q "CAPCUT OVERLAY PLAN" static/overlay_v15.js
